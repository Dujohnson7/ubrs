      # Mailjet Mail Configuration
      - key: MAILJET_API_KEY
        value: eaf78ea3896a73441c8cfdda674ff4e3
      - key: MAILJET_SECRET_KEY
        value: b7b5aaf682504543bed3cf02dc3741f3 
      - key: MAILJET_FROM_EMAIL
        value: dujohnson777@gmail.com
      - key: MAILJET_FROM_NAME
        value: UBRS

  # =============================================
  # Frontend - Vite/React Static Site
  # =============================================
  - type: web
    name: ubrs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html