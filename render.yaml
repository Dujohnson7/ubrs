# render.yaml - Render Blueprint for UBRS
# This file defines the infrastructure for the UBRS application.
# Connect this repo to Render and it will auto-detect this blueprint.

services:
  # =============================================
  # Backend - Spring Boot Web Service (Docker)
  # =============================================
  - type: web
    name: ubrs-backend
    runtime: docker
    rootDir: ubrs_backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://ep-super-thunder-a531bauq-pooler.us-east-2.aws.neon.tech/ubrsDB?sslmode=require
      - key: DATABASE_USERNAME
        value: neondb_owner
      - key: DATABASE_PASSWORD
        value: npg_mguM3XkByn8A
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Mail Configuration (Commented out SMTP)
